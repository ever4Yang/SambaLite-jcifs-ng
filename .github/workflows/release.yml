name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'  # v2.5.6 publishes a release, v2.5.6-rc1 a pre-release

    
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Detect ref type and extract version
      id: extract_version
      run: |
        REF="${{ github.ref_name }}"
        if [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-rc([0-9]+))?$ ]]; then
          MAJOR=${BASH_REMATCH[1]}
          MINOR=${BASH_REMATCH[2]}
          PATCH=${BASH_REMATCH[3]}
          RC=${BASH_REMATCH[5]}
          VERSION="${REF#v}"
          BASE_VERSION="$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          PRERELEASE=$( [ -n "$RC" ] && echo true || echo false )
          {
            echo "IS_TAG=true"
            echo "VERSION=$VERSION"
            echo "BASE_VERSION=$BASE_VERSION"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Tag detected: $VERSION (versionCode $VERSION_CODE, pre-release: $PRERELEASE)"
        else
          echo "IS_TAG=false" >> "$GITHUB_OUTPUT"
          echo "Branch detected: $REF — build only, no GitHub Release will be created"
        fi

    - name: Check that the tag matches the version in the build files
      if: steps.extract_version.outputs.IS_TAG == 'true'
      env:
        BASE_VERSION: ${{ steps.extract_version.outputs.BASE_VERSION }}
        VERSION_CODE: ${{ steps.extract_version.outputs.VERSION_CODE }}
      run: |
        GRADLE_VERSION=$(sed -n "s/^[[:space:]]*version = '\([0-9.]*\)'.*/\1/p" build.gradle)
        GRADLE_CODE=$(sed -n 's/^[[:space:]]*versionCode \([0-9]*\).*/\1/p' app/build.gradle)
        if [ "$GRADLE_VERSION" != "$BASE_VERSION" ]; then
          echo "::error file=build.gradle::version = '$GRADLE_VERSION' does not match tag version $BASE_VERSION"
          exit 1
        fi
        if [ "$GRADLE_CODE" != "$VERSION_CODE" ]; then
          echo "::error file=app/build.gradle::versionCode $GRADLE_CODE does not match $VERSION_CODE expected for $BASE_VERSION"
          exit 1
        fi
        echo "build.gradle version $GRADLE_VERSION and versionCode $GRADLE_CODE match the tag"

    - name: Set the release candidate suffix as versionName
      if: steps.extract_version.outputs.IS_TAG == 'true' && steps.extract_version.outputs.PRERELEASE == 'true'
      env:
        VERSION: ${{ steps.extract_version.outputs.VERSION }}
      run: |
        sed -i "s/^\([[:space:]]*version = '\)[0-9.]*'/\1${VERSION}'/" build.gradle
        grep -n "version = '" build.gradle

    - name: Build Debug APK (branch build)
      if: steps.extract_version.outputs.IS_TAG == 'false'
      run: ./gradlew assembleDebug

    - name: Build Release APK and Bundle (tag build)
      if: steps.extract_version.outputs.IS_TAG == 'true'
      run: |
        ./gradlew assembleRelease bundleRelease \
          -PSIGNING_KEY_ALIAS="${SIGNING_KEY_ALIAS}" \
          -PSIGNING_KEY_PASSWORD="${SIGNING_KEY_PASSWORD}" \
          -PSIGNING_STORE_PASSWORD="${SIGNING_STORE_PASSWORD}"
        VERSION="${{ steps.extract_version.outputs.VERSION }}"
        mv app/build/outputs/apk/release/app-release.apk \
           app/build/outputs/apk/release/SambaLite-v${VERSION}-release.apk
        mv app/build/outputs/bundle/release/app-release.aab \
           app/build/outputs/bundle/release/SambaLite-v${VERSION}-release.aab
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

    - name: List all APK files after build
      run: find app/build/outputs/ -type f -name "*.apk"

    - name: Prepare branch build notes
      if: steps.extract_version.outputs.IS_TAG == 'false'
      run: |
        REF="${{ github.ref_name }}"
        COMMIT_SHA=$(git rev-parse --short HEAD)
        COMMIT_MSG=$(git log -1 --pretty=format:"%s")
        {
          echo "Automated release build from branch \`${REF}\`."
          echo ""
          echo "**Commit:** \`${COMMIT_SHA}\` ${COMMIT_MSG}"
        } > branch-build-notes.md

    - name: Publish latest pre-release (branch build)
      if: steps.extract_version.outputs.IS_TAG == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Build
        body_path: branch-build-notes.md
        prerelease: true
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate checksums
      if: steps.extract_version.outputs.IS_TAG == 'true'
      run: |
        VERSION="${{ steps.extract_version.outputs.VERSION }}"
        cd app/build/outputs/apk/release/
        sha256sum SambaLite-v${VERSION}-release.apk > SambaLite-v${VERSION}-release.apk.sha256
        cd ../../bundle/release/
        sha256sum SambaLite-v${VERSION}-release.aab > SambaLite-v${VERSION}-release.aab.sha256

    - name: Create Release Notes
      if: steps.extract_version.outputs.IS_TAG == 'true'
      id: release_notes
      env:
        VERSION: ${{ steps.extract_version.outputs.VERSION }}
        BASE_VERSION: ${{ steps.extract_version.outputs.BASE_VERSION }}
        PRERELEASE: ${{ steps.extract_version.outputs.PRERELEASE }}
      run: |
        changelog_section() {
          awk -v head="## [$1]" 'index($0, head) == 1 {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.md
        }
        {
          echo "RELEASE_NOTES<<EOF"
          echo "## SambaLite v${VERSION}"
          echo ""
          if [ "$PRERELEASE" = "true" ]; then
            echo "> **Release candidate** for ${BASE_VERSION}, intended for testing. It carries the versionCode of the final ${BASE_VERSION}, so the final release installs over it as a normal update."
            echo ""
          fi
          echo "### Downloads"
          echo "- **APK**: For direct installation (sideloading)"
          echo "- **AAB**: For Google Play Store and other app stores"
          echo ""
          echo "### Verification"
          echo "Both files include SHA256 checksums for integrity verification."
          echo ""
          echo "### Changelog"
          if [ -f CHANGELOG.md ]; then
            NOTES=$(changelog_section "$VERSION")
            [ -n "$NOTES" ] || NOTES=$(changelog_section "$BASE_VERSION")
            if [ -z "$NOTES" ] && [ "$PRERELEASE" = "true" ]; then
              NOTES=$(changelog_section "Unreleased")
            fi
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "See commit history for detailed changes."
            fi
          else
            echo "See commit history for detailed changes."
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      if: steps.extract_version.outputs.IS_TAG == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.extract_version.outputs.VERSION }}
        name: SambaLite v${{ steps.extract_version.outputs.VERSION }}
        body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
        draft: false
        prerelease: ${{ steps.extract_version.outputs.PRERELEASE == 'true' }}
        files: |
          app/build/outputs/apk/release/SambaLite-v${{ steps.extract_version.outputs.VERSION }}-release.apk
          app/build/outputs/apk/release/SambaLite-v${{ steps.extract_version.outputs.VERSION }}-release.apk.sha256
          app/build/outputs/bundle/release/SambaLite-v${{ steps.extract_version.outputs.VERSION }}-release.aab
          app/build/outputs/bundle/release/SambaLite-v${{ steps.extract_version.outputs.VERSION }}-release.aab.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
